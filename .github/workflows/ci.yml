name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xyro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Schema-valid placeholders, not real secrets — src/config/env.js
      # requires every key to be present and well-formed before anything
      # (including the DB-backed tests) can boot, even ones this workflow
      # never actually exercises (Discord OAuth, the bot token, ...).
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/xyro_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/xyro_test
      DISCORD_CLIENT_ID: '123456789012345678'
      DISCORD_CLIENT_SECRET: ci-placeholder
      DISCORD_BOT_TOKEN: ci-placeholder
      DISCORD_HUB_GUILD_ID: '123456789012345678'
      SESSION_SECRET: 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
      TOKEN_ENC_KEY: 'BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc='
      PUBLIC_BASE_URL: https://ci.invalid
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run migrate
      - run: npm run test:db
