name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  # Self-contained rather than depending on the separate CI workflow's result
  # (GitHub Actions has no native "wait for another workflow file" primitive
  # without a third-party action) — duplicates ci.yml's steps once, but
  # guarantees `deploy` never runs unless this exact commit just passed them.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xyro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/xyro_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/xyro_test
      DISCORD_CLIENT_ID: '123456789012345678'
      DISCORD_CLIENT_SECRET: ci-placeholder
      DISCORD_BOT_TOKEN: ci-placeholder
      DISCORD_HUB_GUILD_ID: '123456789012345678'
      SESSION_SECRET: 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
      TOKEN_ENC_KEY: 'BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc='
      PUBLIC_BASE_URL: https://ci.invalid
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run migrate
      - run: npm run test:db

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          port="${VPS_PORT:-22}"
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$port" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -p "$port" "$VPS_USER@$VPS_HOST" 'bash /opt/xyro-market/deploy/deploy.sh'
